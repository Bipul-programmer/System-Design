spring.application.name=URLShortener-Test

# In-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# App properties for testing
app.base-url=http://localhost:8080
app.rate-limit.max-requests=1000
app.rate-limit.window-seconds=60
app.default-ttl-days=30
